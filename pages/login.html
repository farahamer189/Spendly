
<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Spendly</title>
    <link rel="icon" href="../assets/spendly-logo.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Original+Surfer&family=Cairo:wght@400;500;600;700;800&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../css/login.css">
    <link rel="stylesheet" href="../css/theme.css">

    <script src="../js/theme.js" defer></script>
    <script src="../js/language.js" defer></script>
    <script src="../js/login.js" defer></script>
</head>

<body class="login-page">

    <header class="top-controls" aria-label="Page controls">
        <button
            type="button"
            id="language-toggle"
            class="language-button"
        >
            عربي
        </button>

        <div class="theme-lamp" id="theme-lamp">
            <div class="lamp">
                <div class="lamp-shade"></div>
                <div class="lamp-light"></div>
            </div>

            <button
                type="button"
                class="lamp-cord"
                id="lamp-cord"
                aria-label="Switch theme"
                title="Pull to switch theme"
            >
                <span class="cord-handle"></span>
            </button>
        </div>
    </header>

    <!-- Always-visible avatar: shows the first email character -->
    <div
        class="profile-avatar login-avatar"
        id="login-avatar"
        aria-label="User avatar"
    ></div>

    <main class="login-container">
        <section class="login-card">

            <p class="eyebrow" data-i18n="loginEyebrow">
                WELCOME BACK
            </p>

            <h1 data-i18n="loginTitle">
                Let's log you in! ✨
            </h1>

            <p class="login-subtitle" data-i18n="loginSubtitle">
                Your money journey continues here.
            </p>

            <form id="login-form" novalidate>
                <div class="form-group">
                    <label for="email" data-i18n="loginEmailLabel">
                        Email address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        data-i18n-placeholder="loginEmailPlaceholder"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password" data-i18n="loginPasswordLabel">
                        Password
                    </label>

                    <div class="password-wrapper">
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            data-i18n-placeholder="loginPasswordPlaceholder"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            id="toggle-password"
                            class="password-toggle"
                            data-i18n-aria="showPassword"
                            aria-label="Show password"
                        >👀</button>
                    </div>
                </div>

                <div
                    id="login-message"
                    class="login-message"
                    role="alert"
                    aria-live="polite"
                    hidden
                ></div>

                <button
                    type="submit"
                    id="login-button"
                    class="login-submit"
                    data-i18n="loginButton"
                >
                    Login 
                </button>
            </form>

            <p class="signup-prompt">
                <span data-i18n="loginNoAccount">
                    Don't have an account?
                </span>

                <a href="signup.html" data-i18n="loginSignupLink">
                    Sign up
                </a>
            </p>

            <a
                href="../index.html"
                class="back-home"
                data-i18n="loginBackHome"
            >← Back to home</a>
        </section>

        <p class="footer-note" data-i18n="loginFooter">
            Little steps today, better money habits tomorrow. 🌷
        </p>
    </main>

</body>
</html>
