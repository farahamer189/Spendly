
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Daily | Spendly</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Original+Surfer&display=swap"
        rel="stylesheet"
    >

    <!-- Favicon -->
    <link
        rel="icon"
        type="image/png"
        href="../assets/spendly-logo.png"
    >

    <!-- Daily CSS -->
    <link rel="stylesheet" href="../css/daily.css">

</head>


<body>

    <main class="daily-container">

        <!-- Page Header -->
        <section class="daily-header">

            <div>
                <p class="page-label">YOUR DAY</p>

                <h1>Today's Spending 💸</h1>

                <p class="page-subtitle">
                    Keep track of what you spend today.
                </p>
            </div>

        </section>


        <!-- Budget Summary -->
        <section class="daily-summary">

            <div class="daily-card">
                <p>Today's Budget</p>
                <h2 id="daily-budget">Not set</h2>
            </div>


            <div class="daily-card">
                <p>Spent Today</p>
                <h2 id="spent-today">0 EGP</h2>
            </div>


            <div class="daily-card">
                <p>Remaining</p>
                <h2 id="remaining-budget">—</h2>
            </div>

        </section>


        <!-- Budget Action -->
        <section class="budget-section">

            <button
                type="button"
                class="budget-btn"
                id="set-budget-btn"
            >
                + Set Today's Budget
            </button>

        </section>


        <!-- Daily Message -->
        <section class="daily-message" id="daily-message">

            <span class="message-icon">💰</span>

            <p id="daily-message-text">
                You haven't added any spending yet.
            </p>

        </section>


        <!-- Today's Spending -->
        <section class="today-spending-section">

            <div class="section-header">

                <div>
                    <p class="page-label">TODAY</p>

                    <h2>Today's Spending</h2>
                </div>

                <button
                    type="button"
                    class="add-spending-btn"
                    id="add-spending-btn"
                >
                    + Add Spending
                </button>

            </div>


            <!-- Spending List -->
            <div
                class="spending-list"
                id="spending-list"
            >

                <!-- Spending items will be added here by JavaScript -->

            </div>

        </section>


    </main>


    <!-- Add Spending Modal -->
    <div
        class="spending-modal"
        id="spending-modal"
    >

        <div class="spending-modal-content">

            <div class="modal-header">

                <div>
                    <p class="page-label">NEW SPENDING</p>

                    <h2>Add spending</h2>
                </div>

                <button
                    type="button"
                    class="close-modal"
                    id="close-modal"
                >
                    ×
                </button>

            </div>


            <form id="spending-form">

                <!-- Spending Name -->
                <div class="form-group">

                    <label for="spending-name">
                        What did you spend on?
                    </label>

                    <input
                        type="text"
                        id="spending-name"
                        placeholder="e.g. Lunch"
                        required
                    >

                </div>


                <!-- Amount -->
                <div class="form-group">

                    <label for="spending-amount">
                        Amount
                    </label>

                    <input
                        type="number"
                        id="spending-amount"
                        placeholder="e.g. 250"
                        min="0"
                        step="0.01"
                        required
                    >

                </div>


                <!-- Category -->
                <div class="form-group">

                    <label for="spending-category">
                        Category
                    </label>

                    <select
                        id="spending-category"
                        required
                    >

                        <option value="">
                            Choose a category
                        </option>

                        <option value="Food">
                            🍔 Food
                        </option>

                        <option value="Transportation">
                            🚕 Transportation
                        </option>

                        <option value="Shopping">
                            🛒 Shopping
                        </option>

                        <option value="Bills">
                            💡 Bills
                        </option>

                        <option value="Entertainment">
                            🎬 Entertainment
                        </option>

                        <option value="Health">
                            💊 Health
                        </option>

                        <option value="Other">
                            📦 Other
                        </option>

                    </select>

                </div>


                <!-- Modal Actions -->
                <div class="modal-actions">

                    <button
                        type="button"
                        class="cancel-btn"
                        id="cancel-modal"
                    >
                        Cancel
                    </button>

                    <button
                        type="submit"
                        class="save-spending-btn"
                    >
                        Add Spending
                    </button>

                </div>

            </form>

        </div>

    </div>


    <!-- Budget Modal -->
    <div
        class="budget-modal"
        id="budget-modal"
    >

        <div class="budget-modal-content">

            <div class="modal-header">

                <div>
                    <p class="page-label">DAILY BUDGET</p>

                    <h2>Set today's budget</h2>
                </div>

                <button
                    type="button"
                    class="close-budget-modal"
                    id="close-budget-modal"
                >
                    ×
                </button>

            </div>


            <form id="budget-form">

                <div class="form-group">

                    <label for="budget-amount">
                        How much can you spend today?
                    </label>

                    <input
                        type="number"
                        id="budget-amount"
                        placeholder="e.g. 1000"
                        min="0"
                        step="0.01"
                        required
                    >

                </div>


                <div class="modal-actions">

                    <button
                        type="button"
                        class="cancel-btn"
                        id="cancel-budget-modal"
                    >
                        Cancel
                    </button>

                    <button
                        type="submit"
                        class="save-budget-btn"
                    >
                        Set Budget
                    </button>

                </div>

            </form>

        </div>

    </div>


    <!-- Daily JavaScript -->
    <script src="../js/daily.js"></script>

</body>

</html>
```
